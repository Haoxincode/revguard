[package]
name = "revguard_swc_plugin"
version = "0.2.0"
edition = "2021"
publish = false
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Match swc-project/plugins workspace pin (compatible with @swc/core >= 1.15)
swc_core = { version = "83.0.0", features = ["ecma_plugin_transform"] }
